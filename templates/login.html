<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindHealth — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f6ecd3;
            --card-cream: #fdf6e3;
            --panel-cream: #f3e7c6;
            --ink: #33241a;
            --ink-soft: #6b5842;
            --line: #d8c9a3;

            --orange: #ff7b3d;
            --orange-deep: #e8631f;
            --blue: #3f8fd1;
            --green: #57b56b;
            --heart-red: #e5484d;
            --yellow: #ffd166;

            --focus: #3f8fd1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: var(--ink);
            min-height: 100vh;
            background-color: var(--bg-cream);
            /* faint pixel-grid texture instead of a flat background */
            background-image:
                linear-gradient(rgba(51, 36, 26, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 36, 26, 0.05) 1px, transparent 1px);
            background-size: 16px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---- decorative top pixel stripe ---- */
        .pixel-stripe {
            width: 100%;
            height: 16px;
            background: repeating-linear-gradient(90deg,
                    var(--ink) 0 16px,
                    var(--ink-soft) 16px 32px,
                    var(--orange) 32px 48px,
                    var(--yellow) 48px 64px,
                    var(--green) 64px 80px,
                    var(--blue) 80px 96px);
        }

        .page-wrap {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
        }

        /* ---- auth card ---- */
        .authCard {
            width: 100%;
            max-width: 420px;
            background: var(--card-cream);
            border: 4px solid var(--ink);
            border-radius: 14px;
            box-shadow: 8px 8px 0 var(--ink);
            overflow: hidden;
        }

        /* ---- header ---- */
        .card-header {
            padding: 22px 24px 18px;
            border-bottom: 3px solid var(--ink);
            background: var(--yellow);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mascot {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        .brand-text h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: var(--ink);
            line-height: 1.4;
        }

        .badge {
            display: inline-block;
            margin-top: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            letter-spacing: 0.5px;
            color: var(--card-cream);
            background: var(--ink);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* ---- tabs ---- */
        .tabs {
            display: flex;
            border-bottom: 3px solid var(--ink);
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 10.5px;
            letter-spacing: 0.5px;
            color: var(--ink-soft);
            background: var(--panel-cream);
            border: none;
            border-right: 3px solid var(--ink);
            cursor: pointer;
        }

        .tab:last-child {
            border-right: none;
        }

        .tab.active {
            background: var(--card-cream);
            color: var(--ink);
        }

        .tab:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: -3px;
        }

        /* ---- panels / forms ---- */
        .panel {
            padding: 24px 24px 20px;
        }

        .panel.hidden {
            display: none;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: var(--ink-soft);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .field input[type="text"],
        .field input[type="email"],
        .field input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            font-family: 'VT323', monospace;
            font-size: 19px;
            color: var(--ink);
            background: var(--card-cream);
            border: 3px solid var(--ink);
            border-radius: 6px;
            outline: none;
        }

        .field input:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 1px;
        }

        .row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--orange);
            border: 2px solid var(--ink);
        }

        .row-between a {
            color: var(--blue);
            text-decoration: none;
            border-bottom: 1px dashed var(--blue);
        }

        .submit-btn {
            width: 100%;
            padding: 13px 0;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: var(--card-cream);
            background: var(--orange);
            border: 3px solid var(--ink);
            border-radius: 8px;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
        }

        .submit-btn:hover {
            background: var(--orange-deep);
        }

        .submit-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 var(--ink);
        }

        .submit-btn:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .switch-text {
            text-align: center;
            font-size: 15px;
            color: var(--ink-soft);
            margin-top: 16px;
        }

        .switch-text button {
            font-family: 'VT323', monospace;
            font-size: 15px;
            color: var(--blue);
            background: none;
            border: none;
            border-bottom: 1px dashed var(--blue);
            cursor: pointer;
            padding: 0;
        }

        .foot-note {
            text-align: center;
            font-size: 13px;
            color: var(--ink-soft);
            padding: 0 22px 18px;
        }

        @media (max-width: 480px) {
            .page-wrap {
                padding: 20px 14px;
            }
        }
    </style>
</head>

<body>

    <div class="pixel-stripe"></div>

    <div class="page-wrap">
        <div class="authCard">

            <div class="card-header">
                <svg class="mascot" viewBox="0 0 7 7" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
                    <!-- original pixel heart mark, no third-party IP -->
                    <rect x="1" y="0" width="1" height="1" fill="#e5484d" />
                    <rect x="2" y="0" width="1" height="1" fill="#e5484d" />
                    <rect x="4" y="0" width="1" height="1" fill="#e5484d" />
                    <rect x="5" y="0" width="1" height="1" fill="#e5484d" />
                    <rect x="0" y="1" width="7" height="1" fill="#e5484d" />
                    <rect x="0" y="2" width="7" height="1" fill="#e5484d" />
                    <rect x="0" y="3" width="7" height="1" fill="#e5484d" />
                    <rect x="1" y="4" width="5" height="1" fill="#e5484d" />
                    <rect x="2" y="5" width="3" height="1" fill="#e5484d" />
                    <rect x="3" y="6" width="1" height="1" fill="#e5484d" />
                </svg>
                <div class="brand-text">
                    <h1>MINDHEALTH</h1>
                    <span class="badge">SAVE POINT</span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" id="loginTab" onclick="showPanel('login')">LOG IN</button>
                <button class="tab" id="signupTab" onclick="showPanel('signup')">SIGN UP</button>
            </div>

            <div class="panel" id="loginPanel">
                <form id="loginForm">
                    <div class="field">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password"
                            required>
                    </div>
                    <div class="row-between">
                        <label class="checkbox-row">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>
                        <a href="#">Forgot?</a>
                    </div>
                    <button type="submit" class="submit-btn">PRESS START ▸</button>
                </form>
                <p class="switch-text">
                    New here? <button type="button" onclick="showPanel('signup')">Create an account</button>
                </p>
            </div>

            <div class="panel hidden" id="signupPanel">
                <form id="signupForm">
                    <div class="field">
                        <label for="signupName">Name</label>
                        <input type="text" id="signupName" name="name" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" name="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" name="password" autocomplete="new-password"
                            required>
                    </div>
                    <div class="field">
                        <label for="signupConfirm">Confirm password</label>
                        <input type="password" id="signupConfirm" name="confirm" autocomplete="new-password"
                            required>
                    </div>
                    <button type="submit" class="submit-btn">NEW GAME ▸</button>
                </form>
                <p class="switch-text">
                    Already have an account? <button type="button" onclick="showPanel('login')">Log in</button>
                </p>
            </div>

            <p class="foot-note">MindHealth offers support, not a diagnosis or emergency care.</p>
        </div>
    </div>

    <script>
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const loginPanel = document.getElementById("loginPanel");
        const signupPanel = document.getElementById("signupPanel");

        function showPanel(which) {
            const isLogin = which === "login";
            loginTab.classList.toggle("active", isLogin);
            signupTab.classList.toggle("active", !isLogin);
            loginPanel.classList.toggle("hidden", !isLogin);
            signupPanel.classList.toggle("hidden", isLogin);
        }

        // Front-end only for now — no requests are sent yet.
        // When the backend is ready, replace these with fetch() calls to
        // /login and /signup (POST, JSON body), matching the pattern used
        // in the chat page's sendMessage() function.
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            console.log("TODO: POST to /login", Object.fromEntries(new FormData(e.target)));
        });

        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();
            console.log("TODO: POST to /signup", Object.fromEntries(new FormData(e.target)));
        });
    </script>

</body>

</html>
